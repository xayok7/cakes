{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактировать торт</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Arial', sans-serif;
    background: #ffe6f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
}

h2 {
    color: #ff4d94;
    margin-top: 20px;
    margin-bottom: 20px;
    text-align: center;
}

/* Форма редактирования */
form {
    background: #fff0f6;
    padding: 20px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

form button {
    width: 100%;
    padding: 12px;
    font-size: 1rem;
    border-radius: 8px;
    background-color: #ff4d94;
    color: white;
    border: none;
    cursor: pointer;
    margin-top: 15px;
}

form button:hover {
    background-color: #ff3399;
}

select, input[type="text"], input[type="checkbox"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    border-radius: 8px;
    border: 1px solid #ffb3d1;
    font-size: 1rem;
}
</style>
</head>
<body>

<h2>Редактировать торт</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
</form>

</body>
</html>
