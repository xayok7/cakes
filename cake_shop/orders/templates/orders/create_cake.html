{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбор пирога</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Arial', sans-serif;
        background: #ffe6f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding-bottom: 40px;
    }

    h2 {
        color: #ff4d94;
        margin-top: 30px;
        text-align: center;
    }

    form {
        background: #fff0f6;
        padding: 20px;
        border-radius: 15px;
        margin-top: 20px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    select, input[type="radio"], input[type="checkbox"], button {
        margin: 5px 0 15px 0;
        width: 100%;
        font-size: 1rem;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #ffb3d1;
    }

    .pie-options {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        justify-content: space-between;
    }

    .pie-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: #ffe6f0;
        padding: 15px;
        border-radius: 12px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.3s ease;
        flex: 1;
        text-align: center;
    }

    .pie-card:hover {
        border-color: #ff4d94;
        box-shadow: 0 4px 10px rgba(255,77,148,0.3);
    }

    .pie-card input {
        margin-bottom: 5px;
        width: auto;
    }

    button {
        background-color: #ff4d94;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
    }

    button:hover {
        background-color: #ff3399;
    }

    h3 {
        color: #ff4d94;
        margin-top: 15px;
        margin-bottom: 5px;
    }
    .cake-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 40px;
    }

    .cake {
        width: 250px;                  /* размер картинки */
        animation: spin 10s linear infinite;  /* вращение бесконечно */
    }


    .caption {
        margin-top: 15px;
        font-size: 2rem;
        color: #ff4d94;
        font-weight: bold;
        text-align: center;
    }
    .rotating-text {
        display: inline-block;
        animation: spin 10s linear infinite;
    }
    @keyframes spin {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
    }
</style>
</head>
<body>

<div class="caption rotating-text">Создай свой торт</div>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <h3>Тип торта</h3>
    <select name="cake_type">
        <option value="standard">Обычный</option>
        <option value="candy">Сладкий</option>
        <option value="premium">Премиум</option>
    </select>

    <h3>Дополнительно</h3>
    <label><input type="checkbox" name="candles"> Свечи (+3)</label><br>
    <label><input type="checkbox" name="text"> Надпись (+5)</label><br>
    <label><input type="checkbox" name="express"> Срочно (×1.2)</label><br>

    <button type="submit">Далее</button>
</form>

<hr>

<h2>Выбери пирог</h2>
<form method="post" action="{% url 'create_pie' %}">
    {% csrf_token %}

    <div class="pie-options">
        <label class="pie-card">
            <input type="radio" name="name" value="apple" required>
            🍎 Яблочный
        </label>

        <label class="pie-card">
            <input type="radio" name="name" value="cherry">
            🍒 Вишнёвый
        </label>

        <label class="pie-card">
            <input type="radio" name="name" value="meat">
            🥩 Мясной
        </label>
    </div>

    <h3>Размер</h3>
    <select name="size">
        <option value="S">Маленький</option>
        <option value="M">Средний</option>
        <option value="L">Большой</option>
    </select>

    <h3>Тесто</h3>
    <select name="dough">
        <option value="classic">Классическое</option>
        <option value="puff">Слоёное (+3)</option>
        <option value="sweet">Сдобное (+2)</option>
    </select>

    <button type="submit">Создать пирог</button>
</form>

</body>
</html>
